name: Feature request
description: Suggest an idea or improvement for usageratio.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that usageratio doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch the feature as you imagine it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you thought about.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mockups, links to a similar feature elsewhere, etc.
