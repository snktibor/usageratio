name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

        **⚠️ Do not paste your `DASHBOARD_PIN`, `USAGE_API_TOKEN`, `TOKEN_ENCRYPTION_KEY`, Redis
        credentials, or any per-machine token here — this is a public issue tracker.** Remove or
        redact them from any config, `.env`, URL, or log excerpt before posting. If the bug *is* a
        security vulnerability (e.g. a way to bypass auth or leak a secret), please use
        [private vulnerability reporting](https://github.com/snktibor/usageratio/security/policy)
        instead of a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Vercel
        - Docker (self-hosted)
        - Local (npm run dev / dev:demo)
        - Other
    validations:
      required: true

  - type: input
    id: dashboard-version
    attributes:
      label: Dashboard version
      description: >-
        From `GET /api/health` (the `version` field, and `commit` if it's set) — e.g. by visiting
        `/api/health` in a browser or `curl -s https://your-deployment/api/health`.
      placeholder: '{"version":"0.1.0","commit":"a1b2c3d",...}'
    validations:
      required: true

  - type: input
    id: client-os
    attributes:
      label: Client OS and mode (if this involves a reporting client)
      placeholder: e.g. macOS 15, automatic (cron) — or "not applicable"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: >-
        Client logs live at `~/Library/Logs/usageratio.log` (macOS), `~/.usageratio.log` (Linux),
        or `%USERPROFILE%\.usageratio\usageratio.log` (Windows). Dashboard/server logs are wherever
        your deployment sends stdout (the Vercel dashboard, or `docker compose logs app`).
        **Redact any token, PIN, or IP address before pasting.**
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
