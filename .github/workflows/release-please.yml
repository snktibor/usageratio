name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # The default GITHUB_TOKEN cannot trigger other workflows, so the
          # release PR (and the tag/release it produces) would never run CI.
          # RELEASE_PLEASE_TOKEN must be a fine-grained PAT (contents:
          # read/write, pull requests: read/write) belonging to an account
          # that can push to this repo.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
